name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the GitHub Release the app checks for updates
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        run: echo "${{ secrets.FLOWSTATE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/flowstate-release.p12"

      - name: Build release APK
        env:
          FLOWSTATE_KEYSTORE_FILE: ${{ runner.temp }}/flowstate-release.p12
          FLOWSTATE_KEYSTORE_PASSWORD: ${{ secrets.FLOWSTATE_KEYSTORE_PASSWORD }}
          FLOWSTATE_KEY_ALIAS: ${{ secrets.FLOWSTATE_KEY_ALIAS }}
          FLOWSTATE_KEY_PASSWORD: ${{ secrets.FLOWSTATE_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flowstate-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Publishes a GitHub Release (tag v<versionName>) with the APK attached. The app's update
      # pop-up reads the latest release, so bump versionName for every release you want users to get.
      # Publishing steps disabled for the 1.3.3 build at Aditya's request (APK only, no release);
      # restored in the follow-up commit.
      - name: Read version
        if: false
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        if: false
        run: cp app/build/outputs/apk/release/app-release.apk "Flowstate-${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub Release
        if: false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Flowstate ${{ steps.version.outputs.name }}
          files: Flowstate-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          make_latest: true
