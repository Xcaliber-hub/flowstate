name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        run: echo "${{ secrets.FLOWSTATE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/flowstate-release.p12"

      - name: Build release APK
        env:
          FLOWSTATE_KEYSTORE_FILE: ${{ runner.temp }}/flowstate-release.p12
          FLOWSTATE_KEYSTORE_PASSWORD: ${{ secrets.FLOWSTATE_KEYSTORE_PASSWORD }}
          FLOWSTATE_KEY_ALIAS: ${{ secrets.FLOWSTATE_KEY_ALIAS }}
          FLOWSTATE_KEY_PASSWORD: ${{ secrets.FLOWSTATE_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flowstate-release-apk
          path: app/build/outputs/apk/release/app-release.apk
